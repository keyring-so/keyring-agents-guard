name: KeyringAgent
options:
  bundleIdPrefix: so.keyring
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KeyringCardClient:
    path: ../../near-hackthon-applets/client-swift

targets:
  KeyringAgent:
    type: application
    platform: iOS
    sources:
      - path: KeyringAgent
        excludes:
          - Info.plist
          - KeyringAgent.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.keyring.agent
        PRODUCT_NAME: KeyringAgent
        INFOPLIST_FILE: KeyringAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyringAgent/KeyringAgent.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: KeyringCardClient
        product: KeyringCardClient

schemes:
  KeyringAgent:
    build:
      targets:
        KeyringAgent: all
    run:
      config: Debug
    archive:
      config: Release
